<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CITYLINE: NEW YORK</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8aa0ad;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block}
#hud{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));left:18px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
#title{font-size:24px;font-weight:900;letter-spacing:.3px}#sub{font-size:13px;margin-top:3px;opacity:.9}
#hint{position:fixed;z-index:5;right:18px;top:max(14px,env(safe-area-inset-top));color:#fff;text-align:right;text-shadow:0 2px 6px #000;pointer-events:none;font-size:13px}
#joy{position:fixed;z-index:10;left:26px;bottom:max(25px,env(safe-area-inset-bottom));width:154px;height:154px;border:2px solid #fff8;border-radius:50%;background:#242b35aa;box-shadow:0 8px 25px #0005}
#knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:#e9eef2dd;box-shadow:0 3px 16px #0008}
#actions{position:fixed;z-index:10;right:22px;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
button{border:1px solid #fff7;border-radius:17px;background:#343a43cc;color:#fff;font-size:16px;font-weight:800;padding:17px 25px;box-shadow:0 5px 16px #0005;backdrop-filter:blur(5px)}
#drive{display:none}
#speed{position:fixed;z-index:5;right:20px;bottom:18px;color:#fff;text-shadow:0 2px 6px #000;font-size:22px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><div id="title">CITYLINE: NEW YORK</div><div id="sub">MANHATTAN • OPEN CITY</div></div>
<div id="hint">🖐 화면 드래그 = 카메라<br>왼쪽 조이스틱 = 이동</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions"><button id="enter">🚗 탑승</button><button id="brake">브레이크</button></div>
<div id="speed">0 km/h</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const S=new THREE.Scene();
S.background=new THREE.Color(0x91a8b6);
S.fog=new THREE.Fog(0x91a8b6,110,520);

const C=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setSize(innerWidth,innerHeight);
R.setPixelRatio(Math.min(devicePixelRatio,1.6));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.05;
document.body.appendChild(R.domElement);

S.add(new THREE.HemisphereLight(0xdceeff,0x30353b,2.1));
const sun=new THREE.DirectionalLight(0xfff4dc,3.1);
sun.position.set(-90,150,80); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-180;sun.shadow.camera.right=180;
sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;
S.add(sun);

function mat(c,rough=.8,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function box(w,h,d,m,x,y,z,rx=0,ry=0,rz=0){
 const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 q.position.set(x,y,z);q.rotation.set(rx,ry,rz);q.castShadow=true;q.receiveShadow=true;S.add(q);return q;
}
function cyl(r,h,m,x,y,z,seg=16){
 const q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);
 q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;S.add(q);return q;
}

/* ground + streets */
const ground=box(620,.3,620,mat(0x626866,1),0,-.15,0);
const asphalt=mat(0x202326,.96),side=mat(0x9b9b96,.92),white=mat(0xf1eee2,.55),yellow=mat(0xd8b63f,.5);
for(let x=-240;x<=240;x+=48){
 box(16,.10,520,asphalt,x,.04,0);
 box(5,.14,520,side,x-12,.09,0); box(5,.14,520,side,x+12,.09,0);
 for(let z=-240;z<240;z+=14) box(.45,.03,7,white,x,.12,z);
}
for(let z=-240;z<=240;z+=48){
 box(520,.10,16,asphalt,0,.04,z);
 box(520,.14,5,side,0,.09,z-12); box(520,.14,5,side,0,.09,z+12);
 for(let x=-240;x<240;x+=14) box(7,.03,.45,white,x,.12,z);
}

/* crosswalks */
for(let x=-240;x<=240;x+=48)for(let z=-240;z<=240;z+=48){
 for(let i=-3;i<=3;i++) box(1.8,.035,14,white,x+i*3,.13,z-9);
 for(let i=-3;i<=3;i++) box(14,.035,1.8,white,x-9,.13,z+i*3);
}

/* building materials */
const palettes=[
 [0x343b45,0x1b2027,0xaab8c2],[0x6d675f,0x393a3b,0xc7c2ad],
 [0x4a5660,0x222a31,0xb5c7d0],[0x756b61,0x38312d,0xd4c5a9],
 [0x53616a,0x293238,0xb9c6c9]
];

function building(x,z,w,d,h,p){
 const b=box(w,h,d,mat(p[0],.82),x,h/2,z);
 /* roof */
 box(w*1.01,.22,d*1.01,mat(p[1],.95),x,h+.11,z);
 const win=mat(p[2],.22,.05);
 const rows=Math.floor((h-5)/4);
 const colsX=Math.max(2,Math.floor(w/4));
 const colsZ=Math.max(2,Math.floor(d/4));
 for(let r=0;r<rows;r++){
   const y=3+r*4;
   for(let i=0;i<colsX;i++){
     if(Math.random()<.86){
       const xx=x-w/2+2.1+i*(w-4.2)/Math.max(1,colsX-1);
       box(1.35,1.65,.055,win,xx,y,z-d/2-.035);
       box(1.35,1.65,.055,win,xx,y,z+d/2+.035,0,Math.PI,0);
     }
   }
   for(let i=0;i<colsZ;i++){
     if(Math.random()<.8){
       const zz=z-d/2+2.1+i*(d-4.2)/Math.max(1,colsZ-1);
       box(.055,1.65,1.35,win,x-w/2-.035,y,zz,0,Math.PI/2,0);
       box(.055,1.65,1.35,win,x+w/2+.035,y,zz,0,-Math.PI/2,0);
     }
   }
 }
 return b;
}

/* Manhattan blocks */
for(let bx=-216;bx<=216;bx+=48)for(let bz=-216;bz<=216;bz+=48){
 if(Math.abs(bx)<45&&Math.abs(bz)<45)continue;
 const h=22+Math.random()*85,w=28+Math.random()*13,d=28+Math.random()*13;
 building(bx+(Math.random()-.5)*5,bz+(Math.random()-.5)*5,w,d,h,palettes[Math.random()*palettes.length|0]);
}

/* parks */
const trunk=mat(0x50351f,.95),leaf=mat(0x245c35,.85);
for(let i=0;i<75;i++){
 let x=-205+Math.random()*410,z=-205+Math.random()*410;
 if(Math.abs((x%48))<15||Math.abs((z%48))<15)continue;
 cyl(.35,4.5,trunk,x,2.25,z,10);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.7,12,9),leaf);
 crown.position.set(x,6,z);crown.scale.y=1.15;crown.castShadow=true;S.add(crown);
}

/* street lights */
const metal=mat(0x25292c,.45,.7);
for(let x=-234;x<=234;x+=24)for(let z=-234;z<=234;z+=48){
 cyl(.11,6,metal,x,3,z,10);box(2.4,.12,.12,metal,x+1.1,6,z);
 const lamp=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),mat(0xffe9b0,.3));
 lamp.position.set(x+2.2,5.85,z);S.add(lamp);
}

/* traffic lights */
function traffic(x,z,rot){
 const pole=cyl(.13,5.5,metal,x,2.75,z,10);
 const head=box(.55,1.5,.35,mat(0x16191b,.6),x,5.1,z,0,rot,0);
 for(let i=0;i<3;i++){
   const l=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),mat([0xd22b2b,0xe3a62e,0x38a45c][i],.35));
   const yy=5.55-i*.42;l.position.set(x+Math.sin(rot)*.3,yy,z+Math.cos(rot)*.3);S.add(l);
 }
}
for(let x=-216;x<=216;x+=48)for(let z=-216;z<=216;z+=48)traffic(x+9,z+9,Math.PI/2);

/* car factory */
const carColors=[0xb52228,0x1c4d7a,0xd8d4c7,0x22252a,0x4c6b45,0xb8752d];
function car(x,z,color=0xb52228,rot=0){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(4.4,1.05,8),mat(color,.55,.15));
 body.position.y=1.05;body.castShadow=true;g.add(body);
 const hood=box(4.05,.45,2.0,body.material,0,1.6,2.7);
 hood.castShadow=true;g.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.55,1.15,3.6),mat(0x202a31,.25,.25));
 cabin.position.set(0,1.85,-.35);cabin.castShadow=true;g.add(cabin);
 const glass=new THREE.Mesh(new THREE.BoxGeometry(3.35,.8,3.25),mat(0x6f8792,.18,.2));
 glass.position.set(0,1.9,-.38);g.add(glass);
 const wheelMat=mat(0x151719,.8);
 for(const sx of [-2.05,2.05])for(const sz of [-2.55,2.55]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.5,16),wheelMat);
  w.rotation.z=Math.PI/2;w.position.set(sx,0.72,sz);w.castShadow=true;g.add(w);
 }
 for(const sx of [-1.5,1.5]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.65,.25,.08),mat(0xfff1cf,.25));l.position.set(sx,1.3,4.02);g.add(l);
  const r=new THREE.Mesh(new THREE.BoxGeometry(.65,.25,.08),mat(0x9e1b1b,.3));r.position.set(sx,1.3,-4.02);g.add(r);
 }
 g.position.set(x,0,z);g.rotation.y=rot;S.add(g);return g;
}
const cars=[];
for(let i=0;i<26;i++){
 const horizontal=Math.random()<.5;
 const lane=(Math.floor(Math.random()*5)-2)*9;
 const along=-220+Math.random()*440;
 const c=carColors[i%carColors.length];
 cars.push(car(horizontal?along:lane,horizontal?lane:along,c,horizontal?0:Math.PI/2));
}

/* player */
const P=new THREE.Group();
const skin=mat(0xc98e63,.75),shirt=mat(0x263b58,.8),pants=mat(0x1c2026,.85);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.8,6,12),shirt);torso.position.y=2.15;torso.castShadow=true;P.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.72,20,14),skin);head.position.y=3.9;head.castShadow=true;P.add(head);
for(const sx of [-.28,.28]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.22,1.35,5,8),pants);l.position.set(sx,.65,0);l.castShadow=true;P.add(l)}
for(const sx of [-.9,.9]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.18,1.35,5,8),skin);a.rotation.z=sx>0?-0.08:0.08;a.position.set(sx*.75,2.25,0);a.castShadow=true;P.add(a)}
P.position.set(0,0,20);S.add(P);

/* drivable car */
const playerCar=car(0,28,0x263f72,0);
playerCar.visible=false;
let inCar=false,carSpeed=0;

/* controls */
let yaw=0,pitch=.28,dist=10,jx=0,jy=0,active=false,drag=false,lx=0,ly=0;
const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function setJ(e){
 const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=55,n=Math.hypot(dx,dy);
 if(n>m){dx*=m/n;dy*=m/n}jx=dx/m;jy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function reset(){jx=jy=0;active=false;knob.style.transform="translate(0,0)"}
joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);setJ(e)}
joy.onpointermove=e=>{if(active)setJ(e)}
joy.onpointerup=reset;joy.onpointercancel=reset;
R.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;R.domElement.setPointerCapture(e.pointerId)}
R.domElement.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.006;pitch=Math.max(-.1,Math.min(.82,pitch-dy*.005))}
R.domElement.onpointerup=()=>drag=false;R.domElement.onpointercancel=()=>drag=false;

const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

document.getElementById("enter").onclick=()=>{
 if(!inCar){
  if(P.position.distanceTo(playerCar.position)<7){inCar=true;P.visible=false;playerCar.visible=true;P.position.copy(playerCar.position);document.getElementById("enter").textContent="🚶 하차"}
 }else{
  inCar=false;P.visible=true;P.position.copy(playerCar.position);P.position.x+=4;playerCar.visible=false;carSpeed=0;document.getElementById("enter").textContent="🚗 탑승";
 }
};
document.getElementById("brake").onpointerdown=()=>{carSpeed*=.65};
document.getElementById("brake").onpointerup=()=>{};

function cam(){
 const target=inCar?new THREE.Vector3(playerCar.position.x,2.1,playerCar.position.z):new THREE.Vector3(P.position.x,2.5,P.position.z);
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 C.position.set(target.x+Math.sin(yaw)*cp*dist,target.y+sp*dist+2,target.z+Math.cos(yaw)*cp*dist);
 C.lookAt(target);
}

let last=performance.now();
function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min(.04,(t-last)/1000);last=t;
 let x=jx,y=jy;
 if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;
 if(inCar){
   if(Math.abs(y)>.05){carSpeed+=(-y)*18*dt;carSpeed=Math.max(-8,Math.min(32,carSpeed))}
   else carSpeed*=Math.pow(.04,dt);
   if(Math.abs(x)>.08)playerCar.rotation.y-=x*1.5*dt*(.35+Math.min(Math.abs(carSpeed)/20,1));
   playerCar.translateZ(carSpeed*dt);
   P.position.copy(playerCar.position);
   document.getElementById("speed").textContent=Math.round(Math.abs(carSpeed)*3.6)+" km/h";
 }else{
   let n=Math.hypot(x,y);
   if(n>.05){
    x/=Math.max(1,n);y/=Math.max(1,n);
    let a=yaw+Math.atan2(x,y),v=8.5;
    P.position.x+=Math.sin(a)*v*dt;P.position.z+=Math.cos(a)*v*dt;P.rotation.y=a;
   }
   document.getElementById("speed").textContent="0 km/h";
 }
 cam();R.render(S,C);
}
requestAnimationFrame(loop);
addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
