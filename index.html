<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CITYLINE: NEW YORK</title>
<style>html,body{margin:0;overflow:hidden;background:#111;touch-action:none;font-family:-apple-system,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}#t{position:absolute;top:15px;left:18px;font-weight:800;font-size:18px}#s{position:absolute;top:43px;left:18px;font-size:12px}.stick{position:absolute;left:24px;bottom:24px;width:122px;height:122px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}.knob{width:55px;height:55px;position:absolute;left:31px;top:31px;border-radius:50%;background:#fff7}.b{position:absolute;right:23px;width:86px;height:58px;border-radius:17px;background:#fff3;border:2px solid #fff6;color:white;font-weight:800;pointer-events:auto}#gas{bottom:30px}#brake{bottom:101px}#enter{right:120px;bottom:30px}</style></head><body><div id="hud"><div id="t">CITYLINE: NEW YORK</div><div id="s">MANHATTAN DISTRICT · 도보</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="b" id="brake">브레이크</button><button class="b" id="gas">가속</button><button class="b" id="enter">탑승</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000),R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.6));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;document.body.prepend(R.domElement);

S.add(new THREE.HemisphereLight(0xd8ebff,0x38423e,2));let sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-140,190,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);S.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78}),box=(w,h,d,m,x,y,z,r=0)=>{let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.y=r;o.castShadow=o.receiveShadow=true;S.add(o);return o};
box(1400,.4,1400,M(0x555a57),0,-.2,0);box(180,.5,1400,M(0x23556b),-540,0,0);box(180,.5,1400,M(0x23556b),540,0,0);

for(let i=-6;i<=6;i++){let z=i*90;box(36,.16,1400,road,0,.08,z);box(5,.24,1400,side,-20,.12,z);box(5,.24,1400,side,20,.12,z);for(let q=-600;q<600;q+=42)box(1,.02,7,line,q,.18,z)}
for(let i=-6;i<=6;i++){let x=i*90;box(1400,.16,36,road,x,.08,0);box(1400,.24,5,side,x,.12,-20);box(1400,.24,5,side,x,.12,20);for(let q=-600;q<600;q+=42)box(7,.02,1,line,x,.18,q)}
let colors=[0x70767b,0x59616a,0x827e77,0x4e5c68,0x696d70];
function building(x,z,w,d,h){box(w,h,d,M(colors[(Math.random()*colors.length)|0]),x,h/2,z,(Math.random()-.5)*.04);let glass=M(0x526d7c);let rows=Math.floor(h/4),cols=Math.floor(w/5);for(let a=1;a<rows;a++)for(let b=0;b<cols;b++)if(Math.random()>.15)box(.8,.65,.06,glass,x-w/2+2.5+b*(w-5)/Math.max(1,cols-1),2+a*(h-3)/rows,z-d/2-.04)}
for(let gx=-6;gx<=6;gx++)for(let gz=-6;gz<=6;gz++){if(Math.abs(gx)<=1&&Math.abs(gz)<=1)continue;if(Math.random()<.08)continue;building(gx*90+(Math.random()-.5)*5,gz*90+(Math.random()-.5)*5,42+Math.random()*22,42+Math.random()*22,20+Math.random()*105)}
box(120,.2,120,M(0x3f5c45),0,.12,0);for(let i=0;i<30;i++){let x=-55+Math.random()*110,z=-55+Math.random()*110;box(1,5,1,M(0x543d2a),x,2.5,z);let l=new THREE.Mesh(new THREE.SphereGeometry(3.1,10,8),M(0x31533b));l.position.set(x,6,z);l.castShadow=true;S.add(l)}
box(190,.8,20,M(0x4d5358),-540,8,270);for(let x=-620;x<-455;x+=18){box(2,16,2,M(0x3f4448),x,0,262);box(2,16,2,M(0x3f4448),x,0,278)}

let ix=0,iy=0,gas=false,brake=false,inCar=false,yaw=0,v=0;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');function st(t){let r=stick.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=43,q=Math.hypot(dx,dy);if(q>m){dx*=m/q;dy*=m/q}ix=dx/m;iy=-dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}

function hold(id,fn){let b=document.getElementById(id);b.ontouchstart=e=>{e.preventDefault();fn(1)};b.ontouchend=()=>fn(0)}hold('gas',q=>gas=q);hold('brake',q=>brake=q);document.getElementById('enter').ontouchstart=e=>{e.preventDefault();inCar=!inCar;document.getElementById('s').textContent=inCar?'MANHATTAN DISTRICT · 차량':'MANHATTAN DISTRICT · 도보'};

function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;let sx=ix+(keys.d?1:0)-(keys.a?1:0),fy=iy+(keys.w?1:0)-(keys.s?1:0);
if(inCar){v+=((gas?1:0)-(brake?1:0)+fy*.35)*18*dt;v*=Math.pow(.90,dt*60);v=THREE.MathUtils.clamp(v,-10,36);yaw+=sx*(.7+Math.abs(v)/18)*dt;car.rotation.y=yaw;car.position.x+=Math.sin(yaw)*v*dt;car.position.z+=Math.cos(yaw)*v*dt;player.position.copy(car.position)}else{yaw+=sx*2.2*dt;player.rotation.y=yaw;player.position.x+=Math.sin(yaw)*fy*6.2*dt;player.position.z+=Math.cos(yaw)*fy*6.2*dt}
